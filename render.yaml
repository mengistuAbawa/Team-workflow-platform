services:
  - type: web
    name: team-workflow-platform
    runtime: node
    buildCommand: npm --prefix client ci && VITE_API_URL=/api npm --prefix client run build && npm --prefix server ci
    startCommand: npm --prefix server start
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
