services:
  - type: web
    name: teamflow-api
    runtime: node
    buildCommand: cd server && npm ci
    startCommand: cd server && npm start
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_HOST
        fromService:
          type: web
          name: teamflow-client
          property: host

  - type: web
    name: teamflow-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && VITE_API_URL="https://${API_HOST}/api" npm run build
    staticPublishPath: ./dist
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: teamflow-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
